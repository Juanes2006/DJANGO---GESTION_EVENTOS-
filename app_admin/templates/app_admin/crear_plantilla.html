{% extends 'app_main/base.html' %} {% block content %}
<div class="container mt-5">
    <h2 class="mb-4">🎨 Crear Plantilla de Certificado</h2>

    <form method="post" enctype="multipart/form-data" class="card shadow p-4">
        {% csrf_token %}

        <!-- 📌 Datos Básicos -->
        <h5 class="mb-3 text-primary">📌 Información Básica</h5>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nombre de la Plantilla</label>
                <input type="text" name="nombre" class="form-control" placeholder="Ej: Certificado estándar" required>
            </div>

        </div>



        <hr>

        <!-- 🎨 Estilos -->
        <h5 class="mb-3 text-success">🎨 Estilo y Colores</h5>
        <div class="row">
            <div class="col-md-3 mb-3">
                <label class="form-label">Fondo</label>
                <input type="color" name="color_fondo" class="form-control form-control-color" value="#ffffff">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Borde</label>
                <input type="color" name="color_borde" class="form-control form-control-color" value="#000000">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Título</label>
                <input type="color" name="color_titulo" class="form-control form-control-color" value="#00008B">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Nombre</label>
                <input type="color" name="color_nombre" class="form-control form-control-color" value="#8B0000">
            </div>
        </div>

        <hr>

        <!-- 🖼️ Imágenes -->
        <h5 class="mb-3 text-warning">🖼️ Imágenes</h5>
        <div class="row">
            <label for="sello" class="form-label">Sello (esquina superior derecha)</label>
            <input type="file" id="sello" name="sello" class="form-control">
        </div>


        <hr>
        <!-- ✍️ Firma -->
        <h5 class="mb-3 text-info">✍️ Firma</h5>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="mostrar_firma" id="firmaCheck">
            <label class="form-check-label" for="firmaCheck">Incluir firma en el certificado</label>
        </div>
        <div class="mb-3">
            <label class="form-label">Texto de Firma</label>
            <input type="text" name="texto_firma" class="form-control" placeholder="Ej: Coordinador del Evento">
        </div>

        <div class="text-end mt-4">
            <button type="submit" class="btn btn-primary px-4">💾 Guardar Plantilla</button>
        </div>

        <hr>
    </form>
</div>
</div>

{% endblock %}
