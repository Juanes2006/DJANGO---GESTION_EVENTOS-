{% extends 'app_main/base.html' %} {% block content %}
<div class="container mt-4">
    <h2>🎨 Crear Plantilla de Certificado</h2>

    <form method="post" enctype="multipart/form-data" class="mt-3">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Nombre:</label>
            <input type="text" name="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Título:</label>
            <input type="text" name="titulo" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Subtítulo:</label>
            <input type="text" name="subtitulo" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Color del Título:</label>
            <input type="color" name="color_titulo" class="form-control form-control-color">
        </div>

        <div class="mb-3">
            <label class="form-label">Color del Nombre:</label>
            <input type="color" name="color_nombre" class="form-control form-control-color">
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="mostrar_firma" id="firmaCheck">
            <label class="form-check-label" for="firmaCheck">Mostrar firma</label>
        </div>

        <div class="mb-3">
            <label class="form-label">Texto de Firma:</label>
            <input type="text" name="texto_firma" class="form-control">
        </div>
        <div class="mb-3">
            <label for="logo" class="form-label">Logo:</label>
            <input type="file" id="logo" name="logo" class="form-control">
        </div>

        <div class="mb-3">
            <label for="sello" class="form-label">Sello:</label>
            <input type="file" id="sello" name="sello" class="form-control">
        </div>


        <div class="mb-3">
            <label class="form-label">Posición Y del Título:</label>
            <input type="number" step="0.1" name="pos_titulo_y" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Posición Y del Nombre:</label>
            <input type="number" step="0.1" name="pos_nombre_y" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Guardar Plantilla</button>
    </form>
</div>
{% endblock %}
